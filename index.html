<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D1B22">
  <meta name="color-scheme" content="light dark">
  <title>Bora!</title>
  <!-- Temporary placeholder page (Task 1). Replaced by the real shell in Task 3. -->
  <style>
    :root {
      --color-primary: #C2410C;
      --color-bg: #FFF8F2;
      --color-text: #18181B;
      --color-muted: #52525B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-primary: #FF8A5B;
        --color-bg: #1D1B22;
        --color-text: #F4F4F5;
        --color-muted: #A1A1AA;
      }
    }
    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, system-ui, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: 48px; color: var(--color-primary); }
    p { margin: 0; color: var(--color-muted); }
    a { color: var(--color-primary); font-weight: 600; touch-action: manipulation; }
  </style>
</head>
<body>
  <h1>Bora!</h1>
  <p>Em construção.</p>
  <a href="spikes/speech-test.html">Testar a voz</a>
</body>
</html>
