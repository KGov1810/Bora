<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D1B22">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bora!">
  <title>Bora!</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=3">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/exercises.css">
  <link rel="stylesheet" href="css/progress.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tab-bar" data-i18n-aria-label="nav.label">
      <a href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>
        </svg>
        <span data-i18n="tabs.home"></span>
      </a>
      <a href="#/lessons" data-route="lessons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z"/>
          <path d="M12 6.5v13"/>
        </svg>
        <span data-i18n="tabs.lessons"></span>
      </a>
      <a href="#/exercises" data-route="exercises">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.5 4.5 19.5 8.5 9 19H5v-4z"/>
          <path d="M13 7l4 4"/>
        </svg>
        <span data-i18n="tabs.exercises"></span>
      </a>
      <a href="#/progress" data-route="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 19.5V14M10 19.5V10M15 19.5V12.5M20 19.5V6"/>
        </svg>
        <span data-i18n="tabs.progress"></span>
      </a>
    </nav>
  </div>
</body>
</html>
