# Cloudflare Worker for Bora! (see docs/specs/SPEC-access.md).
# Deployed by Workers Builds with "worker/" as root directory.
# The ACCESS_CODE secret is set in the Cloudflare dashboard, never here.
name = "bora-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# D1 database for saved exercise answers (see docs/specs/SPEC-progress.md).
# The ID identifies the database; it is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "bora-db"
database_id = "8899dd86-69db-4f4e-962b-f6992a2e94ba"
